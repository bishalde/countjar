<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CountJar{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="wrap nav">
    <a href="{{ url_for('home') }}" class="logo">🫙 CountJar</a>
    <a href="https://github.com/bishalde/countjar">GitHub</a>
  </header>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <footer class="wrap muted">Simple counters for any website.</footer>
</body>
</html>
